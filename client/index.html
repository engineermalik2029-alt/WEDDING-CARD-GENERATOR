<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-powered premium wedding invitation generator." />
    <title>Premium Wedding Invitation Studio</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,#5d3b12,transparent 34%),linear-gradient(135deg,#08070d,#17111f);color:#fff7d6;font-family:Inter,Arial,sans-serif;padding:24px;text-align:center;">
        <section style="max-width:720px;border:1px solid rgba(255,255,255,.14);border-radius:32px;background:rgba(255,255,255,.08);padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.45);">
          <div style="font-size:42px;margin-bottom:10px;">💍</div>
          <h1 style="margin:0;font-size:clamp(34px,6vw,70px);line-height:.95;color:white;">Premium Wedding Invitation Studio</h1>
          <p style="font-size:18px;line-height:1.7;color:rgba(255,247,214,.78);">Loading the React app...</p>
          <p style="font-size:14px;line-height:1.6;color:rgba(255,247,214,.65);">If you opened this file directly and it stays here, run <b>start-website.bat</b> or use <b>npm run dev</b>, then open <b>http://localhost:5173</b>.</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
